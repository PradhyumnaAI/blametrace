[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blametrace"
dynamic = ["version"]
description = "Causal failure debugging for PyTorch models: find and prove the internal units behind failures."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
keywords = ["pytorch", "interpretability", "causal", "debugging", "ablation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "torch>=2.3.0",
    "pydantic>=2.7.0",
]

[project.urls]
Homepage = "https://github.com/PradhyumnaAI/blametrace"
Repository = "https://github.com/PradhyumnaAI/blametrace"
Issues = "https://github.com/PradhyumnaAI/blametrace/issues"

[project.optional-dependencies]
llm = ["httpx>=0.27.0"]
vision = ["pillow>=10.3.0", "torchvision>=0.18.0"]
all = ["blametrace[llm,vision]"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.9.0",
    "mypy>=1.10.0",
]

[tool.hatch.version]
path = "src/blametrace/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/blametrace"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["blametrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "benchmark: planted-shortcut ground-truth verification tests (release gates)",
]
